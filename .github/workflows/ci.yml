name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,lint]"

      - name: Run linter
        run: ruff check src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Run i18n validator CLI on all target locales
        run: |
          set -e
          for file in locales/*.json; do
            if [ "$file" != "locales/en.json" ]; then
              echo "Validating $file against locales/en.json..."
              loc-validator check locales/en.json "$file"
            fi
          done