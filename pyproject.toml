[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loc-validator-cli"
version = "0.1.0"
description = "Validate JSON and YAML localization files before deployment"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "PyYAML>=6.0"]

[project.scripts]
loc-validator = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E101"]
